<style>
/* Guia de Estilos v2 do GuaraTracking: tokens de tokens-dashboard.css do g01. */
@font-face { font-family: 'Fredoka'; font-weight: 600; src: url(/assets/fredoka-600.ttf); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(/assets/atkinson-hyperlegible-400.ttf); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(/assets/atkinson-hyperlegible-700.ttf); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(/assets/jetbrains-mono-400.ttf); }
:root {
  --gt-guara: #c8232c; --gt-urucum: #8f1820; --gt-semente: #161414; --gt-polpa: #f7f4f1;
  --gt-areia: #d6d1cc; --gt-pedra: #6b6460; --gt-folha: #3f7d4e; --gt-surface: #fff;
  --gt-danger-bg: #fff1f2; --gt-success-bg: #eef7ef; --gt-success-fg: #2b6038; --gt-neutral-bg: #f2f0ee;
  --gt-display: 'Fredoka', 'Trebuchet MS', sans-serif;
  --gt-body: 'Atkinson Hyperlegible', Arial, sans-serif;
  --gt-data: 'JetBrains Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/24px var(--gt-body); background: var(--gt-polpa); color: var(--gt-semente); }
.topo { background: var(--gt-surface); border-bottom: 1px solid var(--gt-areia); padding: 12px 24px; }
.topo svg { display: block; width: 168px; height: auto; }
main { max-width: 1440px; margin: auto; padding: 24px; display: grid; gap: 16px; }
main > * { min-width: 0; }
.titulo { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
h1 { font: 600 30px/36px var(--gt-display); margin: 0; }
.leitura { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
#atual { font: 400 30px/36px var(--gt-data); font-variant-numeric: tabular-nums; }
#status { font-size: 14px; line-height: 20px; padding: 4px 12px; border-radius: 999px; background: var(--gt-neutral-bg); color: var(--gt-pedra); }
#status::before { content: '○ '; }
#status.ok { background: var(--gt-success-bg); color: var(--gt-success-fg); }
#status.ok::before { content: '✓ '; }
#status.ruim { background: var(--gt-danger-bg); color: var(--gt-urucum); }
#status.ruim::before { content: '⚠ '; }
#botoes { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; min-height: 44px; padding: 8px 16px; border: 1px solid var(--gt-areia); border-radius: 8px; background: var(--gt-surface); color: inherit; cursor: pointer; }
button:hover { border-color: var(--gt-semente); }
button[aria-pressed=true] { background: var(--gt-semente); border-color: var(--gt-semente); color: #fff; font-weight: 700; }
button:focus-visible { outline: 2px solid var(--gt-semente); outline-offset: 3px; }
.card { background: var(--gt-surface); border: 1px solid var(--gt-areia); border-radius: 12px; padding: 20px; }
#g { height: 440px; }
.rolagem { overflow-x: auto; padding: 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 20px; }
th, td { height: 44px; padding: 0 20px; border-bottom: 1px solid var(--gt-areia); text-align: right; }
td { font-family: var(--gt-data); font-variant-numeric: tabular-nums; }
th { font-weight: 700; color: var(--gt-pedra); }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { text-align: left; font-family: var(--gt-body); }
tbody tr:hover { background: var(--gt-polpa); }
</style>
</head>

  <text x="66.9" y="65.56" font-family="Arial, Helvetica, sans-serif" font-size="34.57"><tspan font-weight="700" fill="#161414">Guará</tspan><tspan fill="#c8232c">tracking</tspan></text>
</svg></div>
<main>
  <header class="titulo"><h1>Intensidade do sinal Wi-Fi (RSSI)</h1><div class="leitura"><span id="atual">-- dBm</span><span id="status" role="status">Conectando</span></div></header>
  <div id="botoes" role="group" aria-label="Condição em teste"></div>
  <div id="g" class="card"><canvas id="c"></canvas></div>
  <div class="card rolagem"><table>
    <thead><tr><th>Condição</th><th>Amostras</th><th>Média (dBm)</th><th>Mínimo</th><th>Máximo</th></tr></thead>
    <tbody id="tab"></tbody>
  </table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const hora = t => new Date(t).toLocaleTimeString('pt-BR');
const pontos = [];
let faixas = [], stats = {}, conds = [], cond = '', broker = false, parado = false, porPainel = false;

// Sombreia as interrupções e marca onde a condição mudou.
const marcas = { id: 'marcas', beforeDatasetsDraw(ch) {
  const { ctx, chartArea: a, scales: { x } } = ch;
  ctx.save();
  ctx.beginPath(); ctx.rect(a.left, a.top, a.width, a.height); ctx.clip();
  ctx.font = "13px 'Atkinson Hyperlegible', Arial";
  for (const f of faixas) {
    const x0 = x.getPixelForValue(f.ini), x1 = x.getPixelForValue(f.fim ?? x.max);
    ctx.fillStyle = '#c8232c22'; ctx.fillRect(x0, a.top, x1 - x0, a.height);
    ctx.fillStyle = '#8f1820'; ctx.fillText(f.painel ? 'painel sem broker' : 'interrupção', x0 + 4, a.bottom - 24);
    if (f.fim) ctx.fillStyle = '#2b6038', ctx.fillText('retomada', x1 + 4, a.bottom - 8);
  }
  let ant = '', n = 0;
  for (const p of pontos) {
    if (p.y === null || p.condicao === ant) continue;
    ant = p.condicao;
    if (!ant) continue;
    const px = x.getPixelForValue(p.x);
    ctx.strokeStyle = '#6b6460'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
    ctx.fillStyle = '#161414'; ctx.fillText(ant, px + 4, a.top + 14 + (n++ % 4) * 15);
  }
  ctx.restore();
} };

Chart.defaults.font.family = "'Atkinson Hyperlegible', Arial, sans-serif";
Chart.defaults.font.size = 13;
Chart.defaults.color = '#6b6460';
Chart.defaults.borderColor = '#e7e2dd';
const ch = new Chart($('c'), {
  type: 'line', plugins: [marcas],
  data: { datasets: [{ data: pontos, borderColor: '#161414', backgroundColor: '#161414', pointRadius: 3, borderWidth: 2, spanGaps: false }] },
  options: {
    animation: false, maintainAspectRatio: false, parsing: false,
    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => i.length ? hora(i[0].parsed.x) : '', label: i => i.parsed.y + ' dBm' } } },
    scales: {
      x: { type: 'linear', title: { display: true, text: 'Tempo (hora da amostra)' }, ticks: { callback: hora, maxTicksLimit: 10, maxRotation: 0 } },
      y: { suggestedMin: -90, suggestedMax: -30, title: { display: true, text: 'Intensidade do sinal (dBm)' } }
    }
  }
});

function aplica(e) {
  if (e.tipo === 'amostra') {
    pontos.push({ x: e.t, y: e.rssi, condicao: e.condicao });
    $('atual').textContent = e.rssi + ' dBm';
    if (e.condicao) {
      const s = stats[e.condicao] ??= { n: 0, soma: 0, min: 0, max: -999 };
      s.n++; s.soma += e.rssi; s.min = Math.min(s.min, e.rssi); s.max = Math.max(s.max, e.rssi);
    }
  } else if (e.tipo === 'interrupcao') {
    parado = true; porPainel = e.painel;
    faixas.push({ ini: e.t, painel: e.painel });
    pontos.push({ x: e.t, y: null });
  } else if (e.tipo === 'retomada') {
    parado = false; faixas[faixas.length - 1].fim = e.t;
  } else if (e.tipo === 'estado') {
    cond = e.condicao; broker = e.broker; conds = e.condicoes;
  }
}

function status() {
  if (!broker) return ['Painel sem conexão com o broker', 'ruim'];
  if (parado) return porPainel ? ['Aguardando o ESP32', ''] : ['Publicações interrompidas', 'ruim'];
  return pontos.length ? ['Recebendo do ESP32', 'ok'] : ['Broker conectado, aguardando o ESP32', ''];
}

function desenha() {
  [$('status').textContent, $('status').className] = status();
  const agora = Date.now();
  ch.options.scales.x.max = parado ? agora : undefined;
  // Os botões só são recriados quando algo muda, para um clique não se perder no meio da atualização.
  const chave = cond + '|' + conds.length;
  if ($('botoes').dataset.chave !== chave) {
    $('botoes').dataset.chave = chave;
    $('botoes').replaceChildren(...conds.map((c, i) => {
      const b = document.createElement('button');
      b.textContent = c || 'Trocando (não conta)';
      b.setAttribute('aria-pressed', c === cond);
      b.onclick = () => fetch('/condicao/' + i, { method: 'POST' });
      return b;
    }));
  }
  $('tab').replaceChildren(...conds.filter(Boolean).map(c => {
    const d = stats[c], r = document.createElement('tr');
    const n = d ? d.n : 0;
    [c, n < 5 ? n + ' de 5' : n, d ? (d.soma / n).toFixed(1) : '--', d ? d.min : '--', d ? d.max : '--']
      .forEach(v => r.insertCell().textContent = v);
    return r;
  }));
  ch.update();
}

document.fonts.load("13px 'Atkinson Hyperlegible'").then(() => ch.update());
const es = new EventSource('/eventos');
es.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.tipo === 'inicio') {
    pontos.length = 0; faixas = []; stats = {}; parado = false;
    e.eventos.forEach(aplica);
  } else aplica(e);
  desenha();
};
es.onerror = () => { broker = false; desenha(); };
setInterval(() => { if (parado) desenha(); }, 1000);
</script>
</body>
</html>
