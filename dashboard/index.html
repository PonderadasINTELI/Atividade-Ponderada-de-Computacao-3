<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RSSI do Wi-Fi | Guarátracking</title>
<script src="/chart.js"></script>
<style>
/* Guia de Estilos v2 do GuaraTracking: tokens de tokens-dashboard.css do g01. */
@font-face { font-family: 'Fredoka'; font-weight: 600; src: url(/assets/fredoka-600.ttf); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 400; src: url(/assets/atkinson-hyperlegible-400.ttf); }
@font-face { font-family: 'Atkinson Hyperlegible'; font-weight: 700; src: url(/assets/atkinson-hyperlegible-700.ttf); }
@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url(/assets/jetbrains-mono-400.ttf); }
:root {
  --gt-guara: #c8232c; --gt-urucum: #8f1820; --gt-semente: #161414; --gt-polpa: #f7f4f1;
  --gt-areia: #d6d1cc; --gt-pedra: #6b6460; --gt-folha: #3f7d4e; --gt-surface: #fff;
  --gt-danger-bg: #fff1f2; --gt-success-bg: #eef7ef; --gt-success-fg: #2b6038; --gt-neutral-bg: #f2f0ee;
  --gt-display: 'Fredoka', 'Trebuchet MS', sans-serif;
  --gt-body: 'Atkinson Hyperlegible', Arial, sans-serif;
  --gt-data: 'JetBrains Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font: 16px/24px var(--gt-body); background: var(--gt-polpa); color: var(--gt-semente); }
.topo { background: var(--gt-surface); border-bottom: 1px solid var(--gt-areia); padding: 12px 24px; }
.topo svg { display: block; width: 168px; height: auto; }
/* Guará-LED, seção 02 do guia (10e): 700 ms aceso / 700 ms apagado transmitindo; 150 ms em alerta. */
#guara .raios { fill: none; stroke: var(--gt-guara); stroke-width: 3.5; stroke-linecap: round; }
#guara .led-off, #guara.desligado .led-on, #guara.aceso .raios { visibility: hidden; }
#guara.desligado .led-off { visibility: visible; }
#guara.transmitindo .led-on { animation: apaga 1.4s steps(1) infinite; }
#guara.transmitindo .led-off { animation: acende 1.4s steps(1) infinite; }
#guara.alerta .led-on { animation: apaga .3s steps(1) infinite; }
#guara.alerta .led-off { animation: acende .3s steps(1) infinite; }
@keyframes apaga { 50% { visibility: hidden; } }
@keyframes acende { 50% { visibility: visible; } }
@media (prefers-reduced-motion: reduce) { #guara * { animation: none !important; } }
main { max-width: 1440px; margin: auto; padding: 24px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
main > * { min-width: 0; }
.titulo { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; justify-content: space-between; }
h1 { font: 600 30px/36px var(--gt-display); margin: 0; text-wrap: balance; }
h2 { font: 600 17px/24px var(--gt-display); margin: 0; }
.leitura { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; }
#atual { font: 400 34px/40px var(--gt-data); font-variant-numeric: tabular-nums; }
#status { font-size: 14px; line-height: 20px; padding: 4px 12px; border-radius: 999px; background: var(--gt-neutral-bg); color: var(--gt-pedra); }
#status::before { content: '○ '; }
#status.ok { background: var(--gt-success-bg); color: var(--gt-success-fg); }
#status.ok::before { content: '✓ '; }
#status.ruim { background: var(--gt-danger-bg); color: var(--gt-urucum); }
#status.ruim::before { content: '⚠ '; }

.card { background: var(--gt-surface); border: 1px solid var(--gt-areia); border-radius: 12px; padding: 20px; }
.barra { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
#modo { font-weight: 700; }
#g { position: relative; height: 380px; overflow: hidden; }

button { font: inherit; color: inherit; background: var(--gt-surface); border: 1px solid var(--gt-areia); border-radius: 8px; min-height: 44px; cursor: pointer; }
button:hover { border-color: var(--gt-semente); }
button:focus-visible { outline: 2px solid var(--gt-semente); outline-offset: 3px; }
button[aria-pressed=true] { background: var(--gt-semente); border-color: var(--gt-semente); color: #fff; }
.janelas { display: flex; gap: 8px; }
.janelas button { padding: 0 14px; font-size: 14px; }

#grupos { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }
.grupo { display: grid; gap: 12px; align-content: start; }
.tiles { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.tile { display: grid; gap: 4px; align-content: start; padding: 12px; text-align: left; }
.tile .nome { font-weight: 700; line-height: 20px; }
.tile .media { font: 400 22px/28px var(--gt-data); font-variant-numeric: tabular-nums; }
.tile .det { font-size: 13px; line-height: 18px; color: var(--gt-pedra); }
.tile .n { font-size: 13px; line-height: 18px; color: var(--gt-pedra); }
.tile .n.pronto { color: var(--gt-success-fg); font-weight: 700; }
.tile progress { width: 100%; height: 6px; appearance: none; border: 0; border-radius: 3px; overflow: hidden; background: var(--gt-neutral-bg); }
.tile progress::-webkit-progress-bar { background: var(--gt-neutral-bg); }
.tile progress::-webkit-progress-value { background: var(--gt-folha); }
.tile progress::-moz-progress-bar { background: var(--gt-folha); }
.tile[aria-pressed=true] :is(.det, .n, .n.pronto) { color: #e7e2dd; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; }
.acoes button { padding: 0 20px; font-weight: 700; }
#zerar { color: var(--gt-urucum); }
#zerar.confirma { background: var(--gt-guara); border-color: var(--gt-guara); color: #fff; }

@media (max-width: 1000px) { #grupos { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  .topo { padding: 10px 16px; }
  .topo svg { width: 148px; }
  main { padding: 16px; gap: 12px; }
  h1 { font-size: 22px; line-height: 28px; }
  .card { padding: 14px; }
  #g { height: 300px; }
  .janelas, .janelas button { flex: 1; }
  .barra > * { width: 100%; }
  .tiles { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .acoes button { width: 100%; }
}
</style>
</head>

C30.14 17.12 29.96 17.39 29.72 17.63C29.49 17.86 29.22 18.04 28.91 18.17C28.60 18.30 28.28 18.36 27.95 18.36C27.62 18.36 27.30 18.30 26.99 18.17C26.68 18.04 26.41 17.86 26.17 17.63C25.94 17.39 25.76 17.12 25.63 16.81C25.50 16.51 25.44 16.19 25.44 15.85C25.44 15.52 25.50 15.20 25.63 14.89C25.76 14.59 25.94 14.31 26.17 14.08C26.41 13.84 26.68 13.66 26.99 13.53C27.30 13.41 27.62 13.34 27.95 13.34C28.28 13.34 28.60 13.41 28.91 13.53C29.22 13.66 29.49 13.84 29.72 14.08C29.96 14.31 30.14 14.59 30.27 14.89C30.39 15.20 30.46 15.52 30.46 15.85Z" fill="#161414"/></g>
  <g class="led-off"><path d="M7.04 50.50L7.04 19.44C7.04 18.42 7.14 17.41 7.34 16.41C7.54 15.41 7.83 14.44 8.22 13.49C8.61 12.55 9.09 11.66 9.66 10.81C10.22 9.96 10.87 9.18 11.59 8.45C12.31 7.73 13.09 7.09 13.94 6.52C14.79 5.96 15.69 5.48 16.63 5.09C17.57 4.70 18.54 4.40 19.54 4.20C20.54 4.00 21.55 3.90 22.57 3.90C23.59 3.90 24.60 4.00 25.60 4.20C26.60 4.40 27.57 4.70 28.52 5.09C29.46 5.48 30.35 5.96 31.20 6.52C32.05 7.09 32.83 7.73 33.55 8.45C34.28 9.18 34.92 9.96 35.49 10.81C36.05 11.66 36.53 12.55 36.92 13.49C37.31 14.44 37.61 15.41 37.81 16.41C38.00 17.41 38.10 18.42 38.10 19.44L38.10 50.50L7.04 50.50Z" fill="none" stroke="#161414" stroke-width="2.4"/><path d="M5.84 48.11L39.30 48.11C39.62 48.11 39.92 48.17 40.21 48.29C40.51 48.41 40.76 48.59 40.99 48.81C41.21 49.04 41.38 49.29 41.51 49.59C41.63 49.88 41.69 50.18 41.69 50.50L41.69 52.29C41.69 52.61 41.63 52.91 41.51 53.21C41.38 53.50 41.21 53.76 40.99 53.98C40.76 54.21 40.51 54.38 40.21 54.50C39.92 54.62 39.62 54.68 39.30 54.68L5.84 54.68C5.53 54.68 5.22 54.62 4.93 54.50C4.64 54.38 4.38 54.21 4.16 53.98C3.93 53.76 3.76 53.50 3.64 53.21C3.52 52.91 3.46 52.61 3.46 52.29L3.46 50.50C3.46 50.18 3.52 49.88 3.64 49.59C3.76 49.29 3.93 49.04 4.16 48.81C4.38 48.59 4.64 48.41 4.93 48.29C5.22 48.17 5.53 48.11 5.84 48.11Z" fill="none" stroke="#161414" stroke-width="2.4"/><path d="M15.6 16.2H21.2M25.1 16.2H30.8" stroke="#161414" stroke-width="2.1" stroke-linecap="round"/></g>

</svg></div>
<main>
  <header class="titulo">
    <h1>Intensidade do sinal Wi-Fi (RSSI)</h1>
    <div class="leitura"><span id="atual">-- dBm</span><span id="status" role="status">Conectando</span></div>
  </header>
  <section class="card">
    <div class="barra">
      <span id="modo" aria-live="polite">Trocando</span>
      <div class="janelas" role="group" aria-label="Período do gráfico"></div>
    </div>
    <div id="g"><canvas id="c" role="img" aria-label="Gráfico do sinal em dBm ao longo do tempo"></canvas></div>
  </section>
  <div class="acoes">
    <button id="trocando" aria-pressed="false">Trocando (não conta)</button>
    <button id="zerar">Resetar testes</button>
  </div>
  <div id="grupos"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const hora = t => new Date(t).toLocaleTimeString('pt-BR');
const GRUPOS = [['Recipiente metalizado', [1, 2, 3]], ['Mãos na antena', [4, 5]], ['Posição da antena', [6, 7]], ['Distância do roteador', [8, 9]]];
const JANELAS = [['1 min', 60], ['5 min', 300], ['Tudo', 0]];
const AMOSTRAS = 5; // o server.js é quem limita
const pontos = [];
let faixas = [], stats = {}, conds = [], cond = '', broker = false, parado = false, porPainel = false, janela = 60, dif = 0;
const agora = () => Date.now() + dif; // relógio do servidor, que carimba as amostras

// Faixas de interrupção e um bloco por trecho de condição, com o nome preso à borda esquerda visível.
const marcas = { id: 'marcas', beforeDatasetsDraw(ch) {
  const { ctx, chartArea: a, scales: { x } } = ch;
  const px = t => Math.min(Math.max(x.getPixelForValue(t), a.left), a.right);
  ctx.save();
  ctx.font = "700 13px 'Atkinson Hyperlegible', Arial";
  const trechos = [];
  for (const p of pontos) {
    if (p.y === null) continue;
    const u = trechos[trechos.length - 1];
    if (u && u.c === p.condicao) u.fim = p.x;
    else { if (u) u.fim = p.x; trechos.push({ c: p.condicao, ini: p.x, fim: p.x }); }
  }
  trechos.forEach((t, i) => {
    const x0 = px(t.ini), x1 = px(i === trechos.length - 1 && t.c === cond ? x.max : t.fim);
    if (!t.c || x1 - x0 < 1) return;
    ctx.fillStyle = '#f7f4f1'; ctx.fillRect(x0, a.top, x1 - x0, a.height);
    ctx.fillStyle = '#c9c2bc'; ctx.fillRect(x0, a.top, 1, a.height);
    ctx.save(); ctx.beginPath(); ctx.rect(x0, a.top, x1 - x0, 24); ctx.clip();
    ctx.fillStyle = '#161414'; ctx.fillText(t.c, x0 + 6, a.top + 16); ctx.restore();
  });
  ctx.font = "13px 'Atkinson Hyperlegible', Arial";
  for (const f of faixas) {
    const x0 = px(f.ini), x1 = px(f.fim ?? x.max);
    if (x1 - x0 < 1) continue;
    ctx.fillStyle = '#c8232c22'; ctx.fillRect(x0, a.top, x1 - x0, a.height);
    ctx.fillStyle = '#8f1820'; ctx.fillText(f.painel ? 'painel sem broker' : 'interrupção', x0 + 6, a.bottom - 26);
    if (f.fim && x1 < a.right) ctx.fillStyle = '#2b6038', ctx.fillText('retomada', x1 + 6, a.bottom - 8);
  }
  ctx.restore();
} };

let passoTempo = 10000;
// Horas redondas: a grade desliza junto com os pontos, em vez de ficar parada.
function marcasDeTempo(eixo) {
  eixo.ticks = [];
  for (let v = Math.ceil(eixo.min / passoTempo) * passoTempo; v <= eixo.max; v += passoTempo) eixo.ticks.push({ value: v });
}

const CLARO = '#b5aea8', ESCURO = '#161414';
Chart.defaults.font.family = "'Atkinson Hyperlegible', Arial, sans-serif";
Chart.defaults.font.size = 13;
Chart.defaults.color = '#6b6460';
Chart.defaults.borderColor = '#e7e2dd';
const ch = new Chart($('c'), {
  type: 'line', plugins: [marcas],
  data: { datasets: [{
    data: pontos, borderColor: ESCURO, borderWidth: 2.5, spanGaps: false, clip: 8,
    segment: { borderColor: c => pontos[c.p1DataIndex]?.condicao ? ESCURO : CLARO },
    pointRadius: c => c.dataIndex === pontos.length - 1 ? 6 : 3,
    pointBackgroundColor: c => c.dataIndex === pontos.length - 1 ? '#c8232c' : pontos[c.dataIndex]?.condicao ? ESCURO : CLARO,
    pointBorderWidth: 0
  }] },
  options: {
    animation: false, maintainAspectRatio: false, parsing: false, normalized: true,
    interaction: { mode: 'nearest', intersect: false },
    plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => i.length ? hora(i[0].parsed.x) : '', label: i => i.parsed.y + ' dBm' } } },
    scales: {
      x: { type: 'linear', ticks: { callback: hora, maxRotation: 0 }, afterBuildTicks: marcasDeTempo, title: { display: true, text: 'Tempo (hora da amostra)' } },
      y: { suggestedMin: -80, suggestedMax: -20, title: { display: true, text: 'Sinal (dBm)' } }
    }
  }
});

// Janela fixa que termina em "agora": os pontos entram pela direita e deslizam para a esquerda.
function deslizar() {
  // Girar o celular: o Chart.js nem sempre percebe que o espaço mudou.
  const { clientWidth: l, clientHeight: alt } = $('g');
  if (ch.width !== l || ch.height !== alt) ch.resize(l, alt);
  if (!pontos.length) { ch.update('none'); return; }
  const x = ch.options.scales.x, fim = agora();
  const ini = janela ? fim - janela * 1000 : Math.min(pontos[0].x, fim - 60000);
  const alvo = (fim - ini) / 1000 / (innerWidth < 600 ? 3 : 6);
  x.min = ini; x.max = fim;
  passoTempo = 1000 * ([5, 10, 20, 30, 60, 120, 300, 600, 1800].find(s => s >= alvo) ?? 3600);
  ch.update('none');
}

function aplica(e) {
  if (e.tipo === 'amostra') {
    pontos.push({ x: e.t, y: e.rssi, condicao: e.condicao });
    $('atual').textContent = e.rssi + ' dBm';
    if (e.condicao) {
      const s = stats[e.condicao] ??= { n: 0, soma: 0, min: 0, max: -999 };
      s.n++; s.soma += e.rssi; s.min = Math.min(s.min, e.rssi); s.max = Math.max(s.max, e.rssi);
    }
  } else if (e.tipo === 'interrupcao') {
    parado = true; porPainel = e.painel;
    faixas.push({ ini: e.t, painel: e.painel });
    pontos.push({ x: e.t, y: null });
  } else if (e.tipo === 'retomada') {
    parado = false; faixas[faixas.length - 1].fim = e.t;
  } else if (e.tipo === 'estado') {
    cond = e.condicao; broker = e.broker; conds = e.condicoes;
  }
}

function status() {
  if (!broker) return ['Painel sem conexão com o broker', 'ruim', 'desligado'];
  if (parado) return porPainel ? ['Aguardando o ESP32', '', 'aceso'] : ['Publicações interrompidas', 'ruim', 'alerta'];
  return pontos.length ? ['Recebendo do ESP32', 'ok', 'transmitindo'] : ['Broker conectado, aguardando o ESP32', '', 'aceso'];
}

const marcar = i => fetch('/condicao/' + i, { method: 'POST' });
const el = (tag, classe, texto = '') => Object.assign(document.createElement(tag), { className: classe, textContent: texto });
const tiles = [];
// Montados uma vez só: recriar a cada amostra perderia cliques e o foco do teclado.
function montar() {
  $('grupos').replaceChildren(...GRUPOS.map(([titulo, ids]) => {
    const g = el('section', 'card grupo'), linha = el('div', 'tiles');
    g.append(el('h2', '', titulo), linha);
    for (const i of ids) {
      const b = el('button', 'tile'), media = el('span', 'media'), det = el('span', 'det'), n = el('span', 'n');
      const barra = Object.assign(document.createElement('progress'), { max: AMOSTRAS });
      barra.setAttribute('aria-hidden', 'true');
      b.append(el('span', 'nome', conds[i]), media, det, barra, n);
      b.onclick = () => marcar(i);
      linha.append(b);
      tiles.push({ b, media, det, barra, n, nome: conds[i] });
    }
    return g;
  }));
}

function desenha() {
  const [texto, classe, led] = status();
  $('status').textContent = texto;
  $('status').className = classe;
  $('guara').setAttribute('class', led);
  if (conds.length && !tiles.length) montar();
  $('trocando').setAttribute('aria-pressed', !cond);
  $('modo').textContent = cond ? (stats[cond]?.n >= AMOSTRAS ? 'Completo, pode avançar: ' : 'Registrando: ') + cond : 'Trocando: estas amostras não contam';
  for (const t of tiles) {
    const s = stats[t.nome], n = s ? s.n : 0;
    t.b.setAttribute('aria-pressed', t.nome === cond);
    t.media.textContent = s ? (s.soma / n).toFixed(1) + ' dBm' : '--';
    t.det.textContent = s ? `de ${s.min} a ${s.max}` : 'sem amostras';
    t.barra.value = n;
    t.n.textContent = n < AMOSTRAS ? `${n} de ${AMOSTRAS} amostras` : `✓ ${n} amostras`;
    t.n.classList.toggle('pronto', n >= AMOSTRAS);
  }
  deslizar();
}

document.querySelector('.janelas').append(...JANELAS.map(([nome, s]) => {
  const b = el('button', '', nome);
  b.setAttribute('aria-pressed', s === janela);
  b.onclick = () => {
    janela = s;
    for (const o of b.parentNode.children) o.setAttribute('aria-pressed', o === b);
    deslizar();
  };
  return b;
}));
$('trocando').onclick = () => marcar(0);
// Dois toques: um toque sem querer no celular não apaga o gráfico.
let voltaZerar;
function confirmaZerar(sim) {
  clearTimeout(voltaZerar);
  $('zerar').classList.toggle('confirma', sim);
  $('zerar').textContent = sim ? 'Confirmar: apagar gráfico e médias' : 'Resetar testes';
  if (sim) voltaZerar = setTimeout(confirmaZerar, 4000, false);
}
$('zerar').onclick = () => {
  const sim = $('zerar').classList.contains('confirma');
  confirmaZerar(!sim);
  if (sim) fetch('/zerar', { method: 'POST' });
};

document.fonts.load("13px 'Atkinson Hyperlegible'").then(() => ch.update('none'));
const es = new EventSource('/eventos');
es.onmessage = m => {
  const e = JSON.parse(m.data);
  if (e.tipo === 'inicio') {
    pontos.length = 0; faixas = []; stats = {}; parado = false;
    $('atual').textContent = '-- dBm';
    dif = e.agora ? e.agora - Date.now() : 0;
    e.eventos.forEach(aplica);
  } else aplica(e);
  desenha();
};
es.onerror = () => { broker = false; desenha(); };
setInterval(deslizar, matchMedia('(prefers-reduced-motion: reduce)').matches ? 1000 : 200);
</script>
</body>
